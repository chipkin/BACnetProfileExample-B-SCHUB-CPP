# example.conf - BACnetExampleBSCHUB config-file template.
#
# Run with:  ./build/BACnetExampleBSCHUB --config example.conf
#
# Format: "key = value", one per line. "#" starts a comment to end-of-line.
# Blank lines are ignored. No [sections].
#
# Precedence: a matching command-line flag ALWAYS overrides the value given
# here; a value given here overrides main.cpp's own built-in default. See
# README.md "Configuration file" and config.h for the full contract.
#
# Every line below is commented out with its built-in default shown - copy
# this file, uncomment and edit only the keys you want to override.

# device-id = 389022
# port = 47808
# sc-port = 47819
# sc-cert-dir = ./certs
# sc-hub-uri =
# sc-failover-uri =

# dcc-password: the ONLY way to set this - there is NO "--dcc-password" CLI
# flag (a CLI argument is visible in process listings/shell history; see
# README.md "Configuration file"). If you set this to a non-empty value,
# RESTRICT THIS FILE'S PERMISSIONS (Windows: icacls; Linux/macOS: chmod 600) -
# the example warns at start-up (via CASExampleHelper::Log) if it looks
# readable by more than its owner/Administrators, but does not refuse to
# start. This same value doubles as the bearer token required by
# POST /certs/<slot> (see http-port below) - leaving it empty disables that
# upload endpoint entirely.
# dcc-password =

# http-port: GET / (status page), GET /health, GET /metrics (no auth) and
# POST /certs/<slot> (bearer-token auth, disabled if dcc-password above is
# empty). See README.md "Status page and HTTP endpoints".
# http-port = 8080

# http-bind: the interface http-port above binds to. Defaults to 127.0.0.1
# (loopback only) if not set. Binding to "0.0.0.0" or a LAN address exposes
# GET /, GET /health and GET /metrics - which have NO authentication - and
# POST /certs/<slot> - which only has a bearer-token check, not a real auth
# scheme - to that network, all still over plain HTTP (no TLS on this
# listener). This example logs a Warning-level line every time it starts
# bound to anything other than 127.0.0.1/localhost. Only uncomment this if
# you have deliberately decided that tradeoff is acceptable for your network -
# see README.md "Status page and HTTP endpoints".
# http-bind = 127.0.0.1

# sc-max-hub-connections: the most BACnet/SC devices that can be connected to
# this hub at the same time, 1 to 4 (default 4). Same as the
# --sc-max-hub-connections command-line option, which wins if both are given.
# When the limit is reached, the next device's BACnet/SC Connect-Request is
# refused until one disconnects.
#
# This example is limited to 4 connections because it is for evaluation and
# testing, not production. A value above 4 is refused: the hub prints an error
# and shuts down. For a production BACnet/SC hub, contact sales@chipkin.com.
# sc-max-hub-connections = 4
# sc-rate-limit = 10
