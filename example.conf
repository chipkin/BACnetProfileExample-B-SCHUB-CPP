# example.conf - BACnetExampleBSCHUB config-file template.
#
# Run with:  ./build/BACnetExampleBSCHUB --config example.conf
#
# Format: "key = value", one per line. "#" starts a comment to end-of-line.
# Blank lines are ignored. No [sections].
#
# Precedence: a matching command-line flag ALWAYS overrides the value given
# here; a value given here overrides main.cpp's own built-in default. See
# docs/manual.md "Configuration file" and config.h for the full contract.
#
# Every line below is commented out with its built-in default shown - copy
# this file, uncomment and edit only the keys you want to override.

# device-id = 389022
# device-name: the Device's Object_Name. It must be unique on the BACnet
# internetwork, so give every hub its own.
# device-name = Chipkin Example B-SCHUB

# ip-network-number / sc-network-number: the BACnet network number of Network
# Port 1 (BACnet/IP) and 2 (BACnet/SC), 1..65534, reported with
# Network_Number_Quality "configured". Unset = 0, quality "unknown".
# ip-network-number =
# sc-network-number =

# log-file: also write everything the hub prints to this file, and rotate it
# at log-max-size-mb, keeping log-max-files old files (<log-file>.1, .2, ...).
# log-file =
# log-max-size-mb = 10
# log-max-files = 5

# port = 47808
# bacnet-ip: on, or off for a BACnet/SC-only device (no UDP socket, no
# Network Port 1; reachable only over BACnet/SC). See docs/manual.md "BACnet/SC only".
# bacnet-ip = on
# sc-port = 47819
# sc-cert-dir = ./certs
# sc-hub-uri =
# sc-failover-uri =

# dcc-password: the ONLY way to set this - there is NO "--dcc-password" CLI
# flag (a CLI argument is visible in process listings/shell history; see
# docs/manual.md "Configuration file"). If you set this to a non-empty value,
# RESTRICT THIS FILE'S PERMISSIONS (Windows: icacls; Linux/macOS: chmod 600) -
# the example warns at start-up (via CASExampleHelper::Log) if it looks
# readable by more than its owner/Administrators, but does not refuse to
# start. It protects DeviceCommunicationControl and ReinitializeDevice.
# dcc-password =

# http-upload-token: the bearer token POST /certs/<slot> requires (see
# http-port below). Config file only, like dcc-password, and it should be a
# DIFFERENT secret from dcc-password (the hub warns if they are the same).
# Leaving it empty disables the upload endpoint entirely.
# http-upload-token =

# http-port: GET / (status page), GET /health, GET /metrics (no auth) and
# POST /certs/<slot> (bearer-token auth, disabled if http-upload-token above is
# empty). See docs/manual.md "Status page and HTTP endpoints".
# http-port = 8080

# http-bind: the interface http-port above binds to. Defaults to 127.0.0.1
# (loopback only) if not set. Binding to "0.0.0.0" or a LAN address exposes
# GET /, GET /health and GET /metrics - which have NO authentication - and
# POST /certs/<slot> - which only has a bearer-token check, not a real auth
# scheme - to that network. Turn on http-tls (below) first, or the token and
# status data travel over plain HTTP; the hub logs a Warning-level line every
# time it starts bound off loopback over plain HTTP. Only uncomment this if
# you have deliberately decided that tradeoff is acceptable for your network -
# see docs/manual.md "Security".
# http-bind = 127.0.0.1

# http-tls: serve the HTTP endpoints over HTTPS (TLS 1.2/1.3) instead of plain
# HTTP. Turn this on before binding off loopback. By default it uses the hub's
# own operational-certificate.pem and private-key.pem from sc-cert-dir;
# http-tls-cert/http-tls-key name a different certificate (e.g. one from your
# web PKI, so browsers trust it) and key.
# http-tls = false
# http-tls-cert =
# http-tls-key =

# sc-max-hub-connections: the most BACnet/SC devices that can be connected to
# this hub at the same time, 1 to 4 (default 4). Same as the
# --sc-max-hub-connections command-line option, which wins if both are given.
# When the limit is reached, the next device's BACnet/SC Connect-Request is
# refused until one disconnects.
#
# This example is limited to 4 connections because it is for evaluation and
# testing, not production. A value above 4 is refused: the hub prints an error
# and shuts down. For a production BACnet/SC hub, contact support@chipkin.com.
# sc-max-hub-connections = 4

# sc-rate-limit: new BACnet/SC connection attempts per second accepted from any
# ONE source address; sc-rate-limit-total: the same for all addresses
# together. Excess attempts are refused before the TLS handshake. 0 = no limit.
# sc-rate-limit = 10
# sc-rate-limit-total = 50

# sc-accept-hub-without-hello: compatibility with hubs that leave the Hello
# option out of their Connect-Accept. When true, the hub connector
# (sc-hub-uri) accepts them anyway. This deviates from ANSI/ASHRAE 135, so it
# is off by default; turn it on only for a hub that needs it. See README.md
# "BACnet/SC compatibility".
# sc-accept-hub-without-hello = false

# sc-accept-device-without-hello: compatibility with devices that leave the
# Hello option out of their Connect-Request, such as YABE. When true, the hub
# accepts them. Deviates from ANSI/ASHRAE 135, so off by default.
# sc-accept-device-without-hello = false
